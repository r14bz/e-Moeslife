name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".aistudio/**"

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure pre-installed Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Resolve semantic version & build number
        id: resolve_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" 2>/dev/null || echo "[]")
          export RELEASES_JSON
          node scripts/resolve-android-version.mjs

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web assets
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_APK_VERSION_CODE: ${{ steps.resolve_version.outputs.version_code }}
          VITE_APK_VERSION_NAME: ${{ steps.resolve_version.outputs.version_name }}
        run: npm run build

      - name: Add & sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply custom app icon (public/assets/app-icon/icon.png)
        run: |
          if ! python3 -c "import PIL" >/dev/null 2>&1; then
            python3 -m pip install --break-system-packages --quiet pillow || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil)
          fi
          python3 scripts/generate-android-icons.py

      - name: Configure Android versioning & release signing
        env:
          APK_VERSION_CODE: ${{ steps.resolve_version.outputs.version_code }}
          APK_VERSION_NAME: ${{ steps.resolve_version.outputs.version_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > android/app/release.keystore
            export ANDROID_KEYSTORE_PATH="release.keystore"
            export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            echo "APK_SIGN_MODE=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret keystore rilis belum diatur — menggunakan debug-signed APK sementara."
            echo "APK_SIGN_MODE=debug" >> "$GITHUB_ENV"
          fi
          node scripts/configure-android-build.mjs

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          TASK="assembleDebug"
          if [ "$APK_SIGN_MODE" = "release" ]; then
            TASK="assembleRelease"
          fi
          for attempt in 1 2 3; do
            echo "Running ./gradlew $TASK (attempt $attempt/3)..."
            if [ "$attempt" -eq 1 ]; then
              if ./gradlew "$TASK" --no-daemon; then
                exit 0
              fi
            else
              if ./gradlew "$TASK" --no-daemon --refresh-dependencies; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build attempt $attempt failed, retrying in 10s..."
              sleep 10
            fi
          done
          exit 1

      - name: Prepare e-moeslife.apk artifact
        run: |
          mkdir -p release-apk
          if [ "$APK_SIGN_MODE" = "release" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/e-moeslife.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/e-moeslife.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: e-moeslife-android-apk
          path: release-apk/e-moeslife.apk

      - name: Publish to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ steps.resolve_version.outputs.version_code }}
          VERSION_NAME: ${{ steps.resolve_version.outputs.version_name }}
          TARGET_TAG: ${{ steps.resolve_version.outputs.target_tag }}
          OLDER_TAGS: ${{ steps.resolve_version.outputs.older_tags }}
        run: |
          RELEASES_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" 2>/dev/null || echo "[]")
          export RELEASES_JSON
          node scripts/generate-release-notes.mjs > release-notes.md
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            gh release edit "$TARGET_TAG" \
              --title "e-Moeslife Android v${VERSION_NAME}" \
              --notes-file release-notes.md
            gh release upload "$TARGET_TAG" release-apk/e-moeslife.apk --clobber
          else
            gh release create "$TARGET_TAG" release-apk/e-moeslife.apk \
              --title "e-Moeslife Android v${VERSION_NAME}" \
              --notes-file release-notes.md
          fi
          if [ -n "$OLDER_TAGS" ]; then
            IFS=',' read -ra OLD_TAG_LIST <<< "$OLDER_TAGS"
            for old_tag in "${OLD_TAG_LIST[@]}"; do
              if [ -n "$old_tag" ] && gh release view "$old_tag" >/dev/null 2>&1; then
                gh release delete "$old_tag" --yes --cleanup-tag || true
              fi
            done
          fi
